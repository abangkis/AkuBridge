<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AkuBrowser</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon-48.png" width="38" height="38" alt="">
        <div>
          <strong>AkuBrowser</strong>
          <span>Your private AI feed</span>
        </div>
      </div>
      <section id="runtime-status" class="runtime-status" hidden aria-live="polite">
        <strong id="runtime-status-title"></strong>
        <span id="runtime-status-detail"></span>
      </section>
      <button id="open-akubrowser" class="primary" type="button">Open AkuBrowser</button>
      <button id="open-setup" class="secondary" type="button">Setup &amp; source access</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
